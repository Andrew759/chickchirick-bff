services:
  nginx-bff:
    build: ./build/prod/nginx
    ports:
      - '${NGINX_BFF_PORT:-86}:80'
    depends_on:
      - api-bff
    networks:
      - backend-bff
  api-bff:
    build:
      context: .
      dockerfile: ./build/prod/Dockerfile
    ports:
      - "${API_BFF_PORT:-8086}:8080"
    volumes:
      - .:/app
    networks:
      - backend-bff


networks:
  backend-bff: