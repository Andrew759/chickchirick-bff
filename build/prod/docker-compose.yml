services:
  nginx-bff:
    build: ./build/prod/nginx
    ports:
      - '86:80'
    depends_on:
      - api-bff
    networks:
      - backend-bff
  api-bff:
    build:
      context: .
      dockerfile: ./build/prod/Dockerfile
    ports:
      - "8086:8080"
    volumes:
      - .:/app
    networks:
      - backend-bff


networks:
  backend-bff: